<body><div id="app"></div><div class="toast" id="toast"></div>
<script>
const lessons=[
  {id:'prism',title:'Square prism inclined to HP',topic:'Solids',time:'7 min',desc:'Project a prism resting on its base edge and tilted 40° to HP.',color:'#635bff'},
  {id:'line',title:'True length of an inclined line',topic:'Lines',time:'5 min',desc:'Find the true length and both inclinations from simple projections.',color:'#2f8d6b'},
  {id:'cone',title:'Section of a cone',topic:'Sections',time:'8 min',desc:'Build a clean elliptical section with the generator method.',color:'#ff6a51'},
  {id:'iso',title:'Isometric cylinder with a hole',topic:'Isometric',time:'6 min',desc:'Use isometric circles and hidden detail with confidence.',color:'#5a83d8'},
  {id:'dev',title:'Development of a cone',topic:'Development',time:'9 min',desc:'Unfold the lateral surface with its true generator.',color:'#8a6bd7'},
  {id:'inter',title:'Cylinder meets cylinder',topic:'Interpenetration',time:'10 min',desc:'Plot the points of intersection between two cylinders.',color:'#b56c6c'}
];
const storage={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const appState={user:storage.get('lw-user',null),plan:storage.get('lw-plan','Free'),history:storage.get('lw-history',[]),theme:storage.get('lw-theme','light')};
if(appState.theme==='dark')document.body.classList.add('dark');
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function go(path){location.hash=path;window.scrollTo({top:0,behavior:'smooth'})}
function route(){return location.hash.slice(1)||'/'}
function currentPath(){return route().split('?')[0]}
function query(){return new URLSearchParams(route().split('?')[1]||'')}
function navLink(path,label){return `<a href="#${path}" class="${currentPath()===path?'active':''}">${label}</a>`}
function icon(){return `<a class="brand" href="#/"><i>∠</i>linewise<em>.</em></a>`}
function shell(content){const signed=appState.user;return `<div class="app-shell"><header class="topbar">${icon()}<nav class="nav">${navLink('/library','Lessons')}${navLink('/solve','Solve a problem')}${navLink('/pricing','Pricing')}</nav><div class="top-actions"><button class="theme-btn" data-theme aria-label="Change theme">${document.body.classList.contains('dark')?'☀':'☾'}</button>${signed?`<button class="avatar" data-go="/account" title="Account">${esc(signed.name).slice(0,1).toUpperCase()}</button>`:`<button class="ghost" data-go="/login">Sign in</button>`}<button class="primary" data-go="/solve">Scan question ↗</button><button class="round-btn menu-toggle" data-go="/library" aria-label="Open lessons">☰</button></div></header>${content}<footer class="footer">${icon()}<span>Exact geometry. Clear reasoning.</span><nav class="footer-links"><a href="#/legal">Privacy</a><a href="#/legal">Terms</a><a href="#/legal">Contact</a></nav></footer></div><div class="mobile-action"><button class="scan" data-go="/solve">scan question ↗</button><button class="samples" data-go="/library">samples</button></div>`}
function home(){return shell(`<main><section class="hero"><div><div class="eyebrow">ENGINEERING GRAPHICS, EXPLAINED</div><h1>See every line.<br><span class="pop">Then draw it.</span></h1><p>Linewise turns an EGD question into a precise, step-by-step lesson. Learn the construction, turn the solid, and head into your exam calm.</p><div class="hero-ctas"><button class="primary" data-go="/solve">Solve a question <span>↗</span></button><button class="ghost" data-go="/library">Explore free lessons</button></div><div class="hero-note"><span class="check">✓</span> 45 guided lessons available without an account</div></div><div class="demo-wrap"><div class="demo-circle"></div><div class="demo-card"><div class="demo-head"><span class="micro">LESSON_04 / SOLIDS</span><span class="live">LIVE 3D</span></div><div class="mini-problem"><strong>Question:</strong> A square prism, 30 mm side and 50 mm axis, rests on HP on a base edge. Axis 40° to HP.</div><div class="mode-switch"><button data-demo-mode="draft">Drafting</button><button data-demo-mode="solid" class="active">3D solid</button><button data-demo-mode="why">Why this line?</button></div><canvas class="hero-canvas" id="home-canvas" aria-label="Interactive 3D prism demo" tabindex="0"></canvas><div class="player-bottom"><span class="step-badge" id="demo-number">01</span><div class="player-title" id="demo-copy">Place the prism in plan view<small>find the resting edge, then project it.</small></div><button class="next-btn" id="demo-next" aria-label="Next lesson step">→</button></div><div class="progress" id="demo-progress"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="sticker">STEP BY STEP<br>NOT MAGIC</div></div></section><section class="proof-strip"><div class="proof-item"><b>45</b>free sample lessons</div><div class="proof-item"><b>3D</b>models you can rotate</div><div class="proof-item"><b>100%</b>computed geometry</div><div class="proof-item"><b>∞</b>why each line exists</div></section><section class="section"><div class="section-top"><div><div class="eyebrow">START WHERE YOU ARE</div><h2>Every tough topic,<br>made drawable.</h2></div><p>Learn the method, not a screenshot of the answer. The same drafting conventions you need in class, made less intimidating.</p></div><div class="lesson-grid">${homeLessonCards()}</div></section><section class="section how-grid"><div class="explain"><div class="eyebrow" style="color:var(--lime)">A RELIABLE WAY TO LEARN</div><h2>AI reads it.<br>Geometry solves it.</h2><p>Vision only identifies the question and dimensions. Exact coordinates come from deterministic geometry, so every line has a reason and a place.</p></div><div class="process"><div class="process-row"><span class="process-icon">⌁</span><div><h4>Snap the question</h4><p>Upload a photo, screenshot or handwritten problem.</p></div><b>01</b></div><div class="process-row"><span class="process-icon">◎</span><div><h4>We read the details</h4><p>Problem type, measurements and inclinations are identified.</p></div><b>02</b></div><div class="process-row"><span class="process-icon">⌗</span><div><h4>Exact geometry builds it</h4><p>Coordinates are computed point by point.</p></div><b>03</b></div><div class="process-row"><span class="process-icon">✦</span><div><h4>You draw it with us</h4><p>Follow the construction and rotate the result in 3D.</p></div><b>04</b></div></div></section><section class="cta-box"><div><h2>Your next “ohhh” moment is one upload away.</h2><p>Try a sample solve now. No account required.</p></div><button class="secondary" data-go="/solve">Scan a question ↗</button></section></main>`)}
function homeLessonCards(){return `<article class="lesson-card featured" data-open="prism"><span class="card-meta">01 / SOLIDS</span><h3>Prisms from every angle</h3><p class="muted">Tilt it, project it, rotate it. Every line has a purpose.</p><span class="topic-link">Open lesson ↗</span>${cubeSvg()}</article><article class="lesson-card tall" data-open="line"><span class="card-meta">02 / LINES</span><h3>True length</h3><p>Find the actual angle.</p>${lineSvg()}</article><article class="lesson-card" data-open="iso"><span class="card-meta">03 / ISOMETRIC</span><h3>Look 3D on paper</h3><p>Circles, cylinders and more.</p>${cylinderSvg()}</article><article class="lesson-card" data-open="cone"><span class="card-meta">04 / SECTIONS</span><h3>Slice the solid</h3><p>See the conic inside.</p>${coneSvg()}</article>`}
function cubeSvg(){return `<svg viewBox="0 0 160 160" fill="none" stroke="currentColor" stroke-width="2"><path d="m20 69 59-35 60 35-59 35-60-35Z"/><path d="M20 69v56l60 35 59-35V69M80 104v56"/><path d="m20 69 60 35 59-35" stroke-dasharray="4 5"/></svg>`}
function lineSvg(){return `<svg viewBox="0 0 160 160" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 128 133 26M23 128h112"/><path d="M44 108 94 97" stroke-dasharray="4 4"/><path d="M49 128a30 30 0 0 1 9-21"/></svg>`}
function cylinderSvg(){return `<svg viewBox="0 0 160 160" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="82" cy="39" rx="42" ry="16"/><path d="M40 39v67c0 22 84 22 84 0V39"/><ellipse cx="82" cy="106" rx="42" ry="16"/><path d="M40 39h84" stroke-dasharray="4 5"/></svg>`}
function coneSvg(){return `<svg viewBox="0 0 160 160" fill="none" stroke="currentColor" stroke-width="2"><path d="m27 128 53-99 53 99H27Z"/><path d="M42 100h76" stroke="var(--coral)" stroke-width="5"/><path d="M80 29v99" stroke-dasharray="4 5"/></svg>`}
function solve(){return shell(`<main class="page"><div class="screen-heading"><div class="eyebrow">YOUR DRAWING DESK</div><h1>Let’s solve this.</h1><p>Drop in the question. We’ll identify the EGD problem, turn it into precise geometry, and walk through every construction line.</p></div><section class="app-layout"><div class="panel solve-panel"><div class="solver-head"><h2>Upload a question</h2><span class="micro">JPG · PNG · screenshot</span></div><label class="upload-stage" id="drop-zone" for="problem-file"><div><div class="upload-glyph">⌁</div><h3>Drop a problem here</h3><p>Or choose a photo from your phone. Clear handwritten questions work too.</p><span class="primary">Choose image</span></div><input id="problem-file" type="file" accept="image/*"></label><div class="hint-row">Tip: include the full question and its dimensions for the best result.</div><div class="preview" id="file-preview"><span class="file-icon">▧</span><div><strong id="file-name">problem-photo.jpg</strong><small id="file-size">Ready to classify</small></div><button class="remove-file" id="remove-file">Remove</button></div><button class="primary generate" id="generate-solution" disabled>Generate my lesson ↗</button></div><aside class="side-stack"><div class="panel small-panel"><h3>What we can teach</h3><div class="topic-pills"><span>Lines</span><span>Planes</span><span>Solids</span><span>Isometric</span><span>Sections</span><span>Development</span><span>Interpenetration</span></div></div><div class="panel small-panel accuracy"><div class="eyebrow" style="color:var(--lime)">NO GEOMETRY GUESSING</div><strong>Exact by construction.</strong><p>AI reads the question; deterministic code computes the points and views.</p></div><div class="panel small-panel"><h3>Want to see it first?</h3><p>Try any of the 45 guided sample lessons without signing in.</p><button class="ghost" style="margin-top:14px" data-go="/library">Browse samples →</button></div></aside></section></main>`)}
function lesson(id){let item=lessons.find(l=>l.id===id)||lessons[0];return shell(`<main class="lesson-workspace"><aside class="lesson-side"><button class="back" data-go="/library">← ALL LESSONS</button><div class="lesson-list-title">${esc(item.topic)}</div>${['Read the question','Set up the views','Project the points','Draw the outline','Check hidden lines','Rotate in 3D'].map((s,i)=>`<button class="lesson-item ${i===0?'active':''}" data-step-jump="${i}"><i>${String(i+1).padStart(2,'0')}</i>${s}</button>`).join('')}</aside><section class="workspace-main"><div class="workspace-top"><div><div class="eyebrow">${esc(item.topic)} · ${esc(item.time)} lesson</div><h1>${esc(item.title)}</h1><p id="lesson-subtitle">${esc(item.desc)}</p></div><div class="view-tabs"><button class="active" data-view="solid">3D solid</button><button data-view="draft">Drafting</button><button data-view="why">Why this line?</button></div></div><canvas id="lesson-canvas" class="lesson-canvas" aria-label="Interactive lesson drawing" tabindex="0"></canvas><div class="step-control"><span class="step-badge" id="lesson-step-number">01</span><div><h3 id="lesson-step-title">Read the question</h3><p id="lesson-step-detail">Start by identifying the base, the axis and the resting edge.</p></div><div class="control-actions"><button class="icon-button" id="lesson-reset" title="Reset 3D view">⌖</button><button class="next-step" id="lesson-next">Next step →</button></div></div></section><aside class="lesson-right"><h3>Question</h3><div class="problem-copy">${esc(item.desc)}<br><br><strong>Given:</strong> square base 30 mm, axis 50 mm, inclination 40° to HP.</div><div class="line-legend"><h3 style="margin-top:4px">Line language</h3><span class="line-key"><i></i> visible outline</span><span class="line-key"><i class="dashed"></i> hidden detail</span><span class="line-key"><i class="current"></i> current construction</span></div><div class="tip"><strong>Why it works</strong><br>Every point is projected from one view to the next, so the relation between views stays exact.</div></aside></main>`)}
function library(){return shell(`<main class="page"><div class="screen-heading"><div class="eyebrow">THE PRACTICE LIBRARY</div><h1>Pick a problem.<br>Get unstuck.</h1><p>Start with a free sample. Each lesson shows the construction, explains the choices, and includes a rotatable solid where it helps.</p></div><div class="filters" id="filters">${['All','Lines','Solids','Isometric','Sections','Development','Interpenetration'].map((f,i)=>`<button class="filter ${i===0?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><section class="library-grid" id="library-grid">${libraryCards('All')}</section></main>`)}
function libraryCards(filter){return lessons.filter(l=>filter==='All'||l.topic===filter).map((l,i)=>`<article class="library-card" data-open="${l.id}"><span class="card-meta">${esc(l.topic).toUpperCase()} · ${esc(l.time)}</span><div class="shape">${miniShape(i)}</div><h3>${esc(l.title)}</h3><p>${esc(l.desc)}</p></article>`).join('')||`<p class="micro">More sample lessons are on their way.</p>`}
function miniShape(i){return `<svg viewBox="0 0 180 74" width="100%" height="74" fill="none" stroke="currentColor" stroke-width="1.5" style="color:${lessons[i%lessons.length].color};position:absolute;inset:0"><path d="M31 56 84 16l59 40H31Z"/><path d="M84 16v40M31 56h112"/><path d="m52 56 32-19 59 19" stroke-dasharray="4 4"/></svg>`}
function history(){if(!appState.user)return shell(authWall('Save every solve, then pick up right where you stopped.'));let rows=appState.history;if(!rows.length)rows=[{id:'prism',title:'Square prism inclined to HP',topic:'Solids',when:'Sample lesson opened'}];return shell(`<main class="page"><div class="screen-heading"><div class="eyebrow">YOUR STUDY TRAIL</div><h1>Keep your wins<br>within reach.</h1><p>Every solved problem is saved here, along with the precise construction you followed.</p></div><section class="history-list">${rows.map((h,i)=>`<article class="history-row" data-open="${esc(h.id)}"><div class="history-ico">${String(i+1).padStart(2,'0')}</div><div><h3>${esc(h.title)}</h3><p>${esc(h.topic)} · ${esc(h.when)}</p></div><button class="ghost">Open →</button></article>`).join('')}</section></main>`)}
function authWall(copy){return `<main class="page"><section class="history-empty"><div class="empty-icon">⌁</div><h2>Save the good stuff.</h2><p>${copy}</p><button class="primary" data-go="/login">Sign in to continue ↗</button></section></main>`}
function login(){return shell(`<main class="page"><section class="auth-card"><div class="auth-icon">✦</div><div class="eyebrow">YOUR STUDY SPACE</div><h2>Welcome to linewise.</h2><p>Sign in to save your solved problems and keep your study history wherever you go.</p><form id="login-form"><label class="field-label">EMAIL ADDRESS</label><input class="field" id="email" type="email" required placeholder="you@example.com"><button class="primary" type="submit">Send me a sign-in link →</button></form><p class="micro" style="margin-top:17px">Demo mode: this signs you in locally—no email is sent.</p></section></main>`)}
function pricing(){return shell(`<main class="page"><div class="screen-heading"><div class="eyebrow">MAKE EXAM PREP CALMER</div><h1>A plan for every<br>kind of deadline.</h1><p>Start with free lessons. Upgrade when you want unlimited solved questions, saved study history and every topic in the library.</p></div><section class="plan-grid">${plan('Free','₹0','Explore 45 sample lessons and try a few solves.',['3 AI solves a day','All 45 sample lessons','Step-by-step 2D drawing'],'Free')}${plan('Pro monthly','₹199','Build momentum when practice gets serious.',['Up to 100 AI solves a day','3D models to rotate','Saved problem history'],'Pro monthly',true,'/ month')}${plan('Pro yearly','₹1,499','Best value for the whole course.',['Everything in Pro monthly','About ₹125 a month','Cancel any time'],'Pro yearly',false,'/ year')}${plan('Exam pack','₹499','Focused access when the exam date is close.',['90 days of Pro','All topics unlocked','One-time, no auto-renewal'],'Exam pack',false,'/ 90 days')}</section></main>`)}
function plan(name,price,desc,items,id,featured=false,per=''){return `<article class="plan ${featured?'featured':''}"><div><span class="plan-label">${featured?'MOST POPULAR':name==='Exam pack'?'EXAM SEASON':name==='Pro yearly'?'BEST VALUE':'START HERE'}</span><h3>${name}</h3><div class="price">${price} ${per?`<span>${per}</span>`:''}</div><p>${desc}</p></div><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul><button class="${featured?'primary':'ghost'}" data-plan="${id}">${appState.plan===id?'Current plan':name==='Free'?'Keep it free':`Choose ${name}`}</button></article>`}
function account(){if(!appState.user)return shell(authWall('Sign in to see your account settings and saved work.'));let u=appState.user;return shell(`<main class="page"><div class="screen-heading"><div class="eyebrow">YOUR SPACE</div><h1>Account & study<br>settings.</h1></div><section class="account-grid"><article class="account-card"><div class="profile-head"><div class="profile-avatar">${esc(u.name).slice(0,1).toUpperCase()}</div><div><h3>${esc(u.name)}</h3><p>${esc(u.email)}</p></div></div><div class="account-stat"><div><b>${appState.history.length||1}</b><span>solves saved</span></div><div><b>${appState.plan}</b><span>current plan</span></div><div><b>3D</b><span>ready to rotate</span></div></div><button class="ghost" style="margin-top:20px" data-signout>Sign out</button></article><article class="account-card"><h2>Study preferences</h2><div class="setting"><span>Dark study mode</span><button class="switch ${document.body.classList.contains('dark')?'on':''}" data-theme></button></div><div class="setting"><span>Step reminders</span><button class="switch on" data-pref="reminders"></button></div><div class="setting"><span>Show construction-line hints</span><button class="switch on" data-pref="hints"></button></div></article><article class="account-card"><h2>Your plan</h2><p style="color:var(--muted);font-size:12px;line-height:1.5">You’re currently on <strong style="color:var(--ink)">${appState.plan}</strong>. Upgrade any time for more solves and saved practice.</p><button class="primary" style="margin-top:14px" data-go="/pricing">View plans →</button></article><article class="account-card"><h2>Recent work</h2>${appState.history.slice(0,2).map(h=>`<div class="setting"><span>${esc(h.title)}</span><button class="ghost" data-open="${esc(h.id)}">Open</button></div>`).join('')||'<p style="color:var(--muted);font-size:12px">Your completed lessons will appear here.</p>'}</article></section></main>`)}
function legal(){return shell(`<main class="page legal"><div class="eyebrow">LINEWISE LEGAL</div><h1 class="screen-heading" style="margin-top:10px">Built for learning.</h1><h2>Privacy</h2><p>In this front-end demo, any account and lesson history data stays in your browser’s local storage. A production release would use secure authenticated storage for user content and payment information.</p><h2>Terms</h2><p>Linewise is designed to teach engineering graphics through deterministic geometry and guided construction. Always follow your institution’s academic integrity expectations when using learning tools.</p></main>`)}
function render(){let p=currentPath(),content=p==='/'?home():p==='/solve'?solve():p==='/library'?library():p==='/history'?history():p==='/login'?login():p==='/pricing'?pricing():p==='/account'?account():p==='/legal'?legal():p==='/lesson'?lesson(query().get('id')):home();$('#app').innerHTML=content;bind();if(p==='/')mountHomeDemo();if(p==='/lesson')mountLesson()}
function bind(){document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>go('/lesson?id='+encodeURIComponent(el.dataset.open))));document.querySelectorAll('[data-theme]').forEach(el=>el.addEventListener('click',toggleTheme));document.querySelectorAll('[data-plan]').forEach(el=>el.addEventListener('click',()=>choosePlan(el.dataset.plan)));document.querySelectorAll('[data-signout]').forEach(el=>el.addEventListener('click',signout));document.querySelectorAll('[data-pref]').forEach(el=>el.addEventListener('click',()=>el.classList.toggle('on')));if(currentPath()==='/solve')bindSolve();if(currentPath()==='/library')bindLibrary();if(currentPath()==='/login')bindLogin()}
function toggleTheme(){document.body.classList.toggle('dark');appState.theme=document.body.classList.contains('dark')?'dark':'light';storage.set('lw-theme',appState.theme);document.querySelector('meta[name="theme-color"]').content=appState.theme==='dark'?'#0e1019':'#f7f6f1';render()}
function choosePlan(plan){appState.plan=plan;storage.set('lw-plan',plan);toast(`${plan} is now selected in this demo.`);render()}
function signout(){appState.user=null;storage.set('lw-user',null);toast('You’re signed out.');go('/')}
function bindLogin(){$('#login-form').addEventListener('submit',e=>{e.preventDefault();let email=$('#email').value.trim();if(!email)return;appState.user={email,name:email.split('@')[0].replace(/[._-]/g,' ').replace(/\b\w/g,x=>x.toUpperCase())};storage.set('lw-user',appState.user);toast('Signed in locally. Your study space is ready.');go('/history')})}
function bindLibrary(){
  document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-filter]').forEach(item=>item.classList.remove('active'));
    btn.classList.add('active');
    $('#library-grid').innerHTML=libraryCards(btn.dataset.filter);
    document.querySelectorAll('[data-open]').forEach(item=>item.addEventListener('click',()=>go('/lesson?id='+encodeURIComponent(item.dataset.open))));
  }));
}
function bindSolve(){const input=$('#problem-file'),zone=$('#drop-zone'),preview=$('#file-preview'),generate=$('#generate-solution');function setFile(file){if(!file)return;$('#file-name').textContent=file.name;$('#file-size').textContent=`${Math.max(1,Math.round(file.size/1024))} KB · ready to classify`;preview.classList.add('show');generate.disabled=false;generate.style.opacity='1';generate.style.cursor='pointer'}input.addEventListener('change',()=>setFile(input.files[0]));['dragenter','dragover'].forEach(evt=>zone.addEventListener(evt,e=>{e.preventDefault();zone.classList.add('drag')}));['dragleave','drop'].forEach(evt=>zone.addEventListener(evt,e=>{e.preventDefault();zone.classList.remove('drag')}));zone.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));$('#remove-file').addEventListener('click',e=>{e.preventDefault();input.value='';preview.classList.remove('show');generate.disabled=true});generate.addEventListener('click',()=>{if(generate.disabled)return;let lesson=lessons[0];appState.history.unshift({id:lesson.id,title:lesson.title,topic:lesson.topic,when:'Solved just now'});appState.history=appState.history.slice(0,10);storage.set('lw-history',appState.history);toast('Geometry complete. Opening your lesson…');setTimeout(()=>go('/lesson?id=prism'),450)})}
function mountHomeDemo(){let canvas=$('#home-canvas'),step=0,mode='solid';let steps=[['01','Place the prism in plan view','find the resting edge, then project it.'],['02','Project the base corners','use light construction lines to stay aligned.'],['03','Connect the final outline','make the visible edges darker.'],['04','Rotate to check the solid','the 3D view confirms your construction.']];let painter=mountCanvas(canvas,()=>mode,()=>step);function update(){let s=steps[step];$('#demo-number').textContent=s[0];$('#demo-copy').innerHTML=`${s[1]}<small>${s[2]}</small>`;document.querySelectorAll('#demo-progress i').forEach((i,n)=>i.classList.toggle('on',n<=step));painter.draw()}$('#demo-next').addEventListener('click',()=>{step=(step+1)%steps.length;update()});document.querySelectorAll('[data-demo-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.demoMode;document.querySelectorAll('[data-demo-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');painter.draw()}));update()}
function mountLesson(){let canvas=$('#lesson-canvas'),step=0,mode='solid';let steps=[['01','Read the question','Start by identifying the base, the axis and the resting edge.'],['02','Set up the views','Draw the reference line and leave enough room for elevation.'],['03','Project the points','Construction lines transfer every corner exactly into the next view.'],['04','Draw the visible outline','Join only the edges you can actually see from this view.'],['05','Check hidden detail','Add dashed edges wherever a face blocks the view.'],['06','Rotate the 3D model','Compare your drafting views with the finished solid.']];let painter=mountCanvas(canvas,()=>mode,()=>step);function update(){let s=steps[step];$('#lesson-step-number').textContent=s[0];$('#lesson-step-title').textContent=s[1];$('#lesson-step-detail').textContent=s[2];document.querySelectorAll('.lesson-item').forEach((x,i)=>x.classList.toggle('active',i===step));painter.draw()}$('#lesson-next').addEventListener('click',()=>{step=(step+1)%steps.length;update()});$('#lesson-reset').addEventListener('click',()=>{painter.reset();toast('3D view reset.')});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');painter.draw()}));document.querySelectorAll('[data-step-jump]').forEach(b=>b.addEventListener('click',()=>{step=+b.dataset.stepJump;update()}));update()}
function mountCanvas(canvas,getMode,getStep){const ctx=canvas.getContext('2d');let yaw=-.72,pitch=.38,down=null;function colors(){let dark=document.body.classList.contains('dark');return dark?{grid:'#ffffff16',line:'#eef0fa',muted:'#9da4b9',f:['#3d358c','#5f54cb','#242757','#766de0','#302b73','#4c44a7'],hot:'#ff7961',lime:'#dcff62'}:{grid:'#20263815',line:'#1b2130',muted:'#778094',f:['#635bff','#827cff','#4344bd','#a19dff','#4e46b7','#6e68e5'],hot:'#ff6a51',lime:'#d9fa5c'}}
function size(){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);return r}
function grid(w,h,c){ctx.strokeStyle=c.grid;ctx.lineWidth=1;for(let x=18;x<w;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=16;y<h;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
function drawDraft(w,h,c,step,why){ctx.setLineDash([5,5]);ctx.strokeStyle=c.muted;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w*.12,h*.77);ctx.lineTo(w*.88,h*.77);ctx.moveTo(w*.5,h*.12);ctx.lineTo(w*.5,h*.86);ctx.stroke();ctx.setLineDash([]);let a=[[w*.28,h*.65],[w*.51,h*.65],[w*.67,h*.53],[w*.44,h*.53]],b=[[w*.28,h*.38],[w*.51,h*.38],[w*.67,h*.26],[w*.44,h*.26]];ctx.strokeStyle=c.line;ctx.lineWidth=2.2;ctx.beginPath();[...a,a[0]].forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();if(step>0){ctx.beginPath();[...b,b[0]].forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.setLineDash([4,4]);ctx.strokeStyle=c.muted;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(...a[i]);ctx.lineTo(...b[i]);ctx.stroke()}ctx.setLineDash([])}if(step>1){ctx.strokeStyle=c.hot;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(...a[0]);ctx.lineTo(...a[1]);ctx.lineTo(...a[2]);ctx.stroke()}if(why){ctx.fillStyle=c.paper||'#fff';ctx.strokeStyle=c.hot;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(w*.1,h*.12,155,44,8);ctx.fill();ctx.stroke();ctx.fillStyle=c.hot;ctx.font='11px DM Sans';ctx.fillText('This line locates the',w*.12,h*.12+18);ctx.fillText('true-length edge.',w*.12,h*.12+33);ctx.strokeStyle=c.hot;ctx.beginPath();ctx.moveTo(w*.3,h*.22);ctx.lineTo(...a[0]);ctx.stroke()}}
function drawSolid(w,h,c,step){const v=[[-1,-.73,-.67],[1,-.73,-.67],[1,.73,-.67],[-1,.73,-.67],[-1,-.73,.67],[1,-.73,.67],[1,.73,.67],[-1,.73,.67]],f=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]],r=v.map(([x,y,z])=>{let X=x*Math.cos(yaw)-z*Math.sin(yaw),Z=x*Math.sin(yaw)+z*Math.cos(yaw),Y=y*Math.cos(pitch)-Z*Math.sin(pitch);Z=y*Math.sin(pitch)+Z*Math.cos(pitch);return[X,Y,Z]}),sc=Math.min(w*.27,h*.32),p=r.map(([x,y,z])=>[w*.5+x*sc/(1+z*.13),h*.51-y*sc/(1+z*.13)]);ctx.setLineDash([5,5]);ctx.strokeStyle=c.muted+'77';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w*.11,h*.8);ctx.lineTo(w*.89,h*.8);ctx.moveTo(w*.5,h*.11);ctx.lineTo(w*.5,h*.84);ctx.stroke();ctx.setLineDash([]);f.map(x=>({x,z:x.reduce((n,i)=>n+r[i][2],0)})).sort((a,b)=>a.z-b.z).forEach((o,n)=>{ctx.beginPath();o.x.forEach((i,j)=>j?ctx.lineTo(...p[i]):ctx.moveTo(...p[i]));ctx.closePath();ctx.fillStyle=c.f[n];ctx.fill();ctx.strokeStyle=c.line;ctx.lineWidth=1.7;ctx.stroke()});if(step>0){ctx.strokeStyle=c.lime;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...p[4]);ctx.lineTo(...p[5]);ctx.lineTo(...p[6]);ctx.stroke()}if(step>2){ctx.fillStyle=c.hot;[p[4],p[5],p[6]].forEach(q=>{ctx.beginPath();ctx.arc(...q,3.5,0,7);ctx.fill()})}ctx.fillStyle=c.muted;ctx.font='10px DM Mono';ctx.fillText('drag to orbit',16,h-15)}
function draw(){let r=size(),w=r.width,h=r.height,c=colors(),mode=getMode(),step=getStep();ctx.clearRect(0,0,w,h);grid(w,h,c);if(mode==='solid')drawSolid(w,h,c,step);else drawDraft(w,h,c,step,mode==='why')}
function reset(){yaw=-.72;pitch=.38;draw()}new ResizeObserver(draw).observe(canvas);canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!down||getMode()!=='solid')return;yaw+=(e.clientX-down[0])*.009;pitch=Math.max(-.7,Math.min(.8,pitch+(e.clientY-down[1])*.008));down=[e.clientX,e.clientY];draw()});canvas.addEventListener('pointerup',()=>down=null);canvas.addEventListener('pointercancel',()=>down=null);canvas.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){yaw-=.12;draw()}if(e.key==='ArrowRight'){yaw+=.12;draw()}if(e.key==='ArrowUp'){pitch-=.1;draw()}if(e.key==='ArrowDown'){pitch+=.1;draw()}});return{draw,reset}}
window.addEventListener('hashchange',render);document.addEventListener('click',e=>{let goEl=e.target.closest('[data-go]');if(goEl){e.preventDefault();go(goEl.dataset.go)}});render();
</script></body></html>
